<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GO'EL — демо</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --paper: #fffcf8;
      --ink: #1c1916;
      --muted: #6b6560;
      --line: #e3ddd4;
      --accent: #7a3330;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      text-align: left;
    }
    .wrap { width: min(980px, calc(100% - 48px)); margin: 0 auto; }
    header {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }
    .mark {
      font-weight: 600;
      font-size: 20px;
      letter-spacing: 0.04em;
    }
    .mark span { letter-spacing: 0; font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 8px; }
    .menu { position: relative; }
    #countries-btn { font-size: 15px; }
    #countries-btn[aria-expanded="true"] { color: var(--accent); }
    .menu-list {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      min-width: 160px;
      background: var(--paper);
      border: 1px solid var(--line);
      z-index: 2;
    }
    .menu-list button { display: block; width: 100%; padding: 10px 14px; font-size: 15px; }
    .menu-list button:hover { background: #f3efe8; }
    nav.links { margin-left: auto; display: flex; gap: 18px; font-size: 15px; }
    .hero { padding: 28px 0 0; }
    h1 {
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-weight: 600;
      font-size: 34px;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin: 0 0 12px;
    }
    .verse { margin: 0 0 8px; max-width: 28em; color: var(--muted); font-size: 16px; line-height: 1.6; }
    .verse span { display: block; margin-top: 8px; }
    h2 {
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-weight: 600;
      font-size: 20px;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--ink);
      margin: 28px 0 12px;
    }
    #home.filtered h2 { display: none; }
    .brand {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 14px;
      align-items: center;
      width: 100%;
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 12px;
      margin-top: 10px;
    }
    .swatch { display: block; height: 64px; }
    .brand b { display: block; font-size: 17px; line-height: 1.35; }
    .brand small { display: block; margin-top: 5px; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .go { color: var(--accent); font-size: 14px; padding-right: 4px; }
    .brand.wait .go { color: var(--muted); }
    .view { display: none; }
    .view.on { display: block; padding-bottom: 48px; }
    #stage.enter { animation: enter 0.32s cubic-bezier(0.2, 0.8, 0.2, 1); }
    @keyframes enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      #stage.enter { animation: none; }
    }
    #home-crumbs { margin-top: 0; }
    .crumbs { display: flex; gap: 8px; align-items: center; margin: 28px 0 22px; font-size: 14px; line-height: 1.4; color: var(--muted); }
    .crumbs[hidden] { display: none; }
    .crumbs .here { color: var(--ink); }
    .brand-head h1 { font-size: 32px; letter-spacing: -0.03em; line-height: 1.2; margin: 0; }
    .brand-head .blurb { margin: 12px 0 0; color: var(--muted); font-size: 16px; line-height: 1.55; }
    .items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 28px 0 40px; }
    .item { background: var(--paper); border: 1px solid var(--line); display: flex; flex-direction: column; cursor: pointer; text-align: left; }
    .item:hover { border-color: #cfc6bb; }
    .cloth { height: 230px; flex: none; position: relative; outline: 1px solid #cfc6bb; outline-offset: -1px; }
    .cloth > .ph, .product-cloth > .ph {
      position: absolute;
      left: 12px;
      bottom: 12px;
      display: inline-block;
      margin: 0;
      background: var(--paper);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      padding: 4px 8px;
    }
    .item { width: 100%; }
    .item .body { padding: 16px 16px 18px; }
    .item b { display: block; font-size: 16px; line-height: 1.4; }
    .item span { display: block; color: var(--muted); font-size: 14px; line-height: 1.45; margin-top: 6px; }
    .item .price { color: var(--ink); margin-top: 10px; line-height: 1.4; }
    .stock { margin: 22px 0 0; font-size: 15px; line-height: 1.5; }
    .ahead { margin: 8px 0 0; font-size: 15px; line-height: 1.5; }
    .order { margin: 16px 0 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .product { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 28px; align-items: start; }
    .product-cloth { height: 460px; position: relative; outline: 1px solid #cfc6bb; outline-offset: -1px; }
    .size-range { margin: 12px 0 0; color: var(--muted); }
    .size-range[hidden] { display: none; }
    .product-copy h1 { margin: 0; }
    .sizes { margin-top: 18px; }
    .sizes[hidden] { display: none; }
    .sizes p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
    .sizes div { display: flex; flex-wrap: wrap; gap: 8px; }
    .size {
      min-width: 44px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: var(--paper);
      text-align: center;
      cursor: pointer;
    }
    .size.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .product-price { margin: 16px 0 0; font-size: 18px; }
    @media (max-width: 800px) {
      h1 { font-size: 28px; }
      .items, .product { grid-template-columns: 1fr; }
      .product-cloth { height: 280px; }
      header { gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <button class="mark" id="logo" type="button">GO'EL <span>демо</span></button>
      <div class="menu">
        <button type="button" id="countries-btn" aria-expanded="false" aria-controls="country-menu">Страны ▾</button>
        <div class="menu-list" id="country-menu" hidden>
          <button type="button" data-slug="belarus">Беларусь</button>
          <button type="button" data-slug="russia">Россия</button>
        </div>
      </div>
      <nav class="links">
        <a href="https://t.me/JHVHGOeL">Telegram</a>
        <a href="https://www.instagram.com/jehovah_goel/">Instagram</a>
      </nav>
    </header>

    <div id="stage">
    <section id="home" class="view on">
      <div class="hero">
        <h1>Христианские бренды<br>одежды в одном месте</h1>
        <p class="verse">«Искупитель наш — Господь Саваоф<br>имя Ему, Святый Израилев.»<span>Isa 47:4</span></p>
      </div>
      <div class="crumbs" id="home-crumbs" hidden>
        <button type="button" id="home-all">Все бренды</button>
        <span>›</span>
        <span class="here" id="home-country"></span>
      </div>
      <div data-country-group="Беларусь">
        <h2>Беларусь</h2>
        <button class="brand" data-brand="godderob">
          <span class="swatch" style="background:#efe8dc"></span>
          <span><b>godderob</b><small>Свитшоты, футболки и полузипы</small></span>
          <span class="go">Смотреть</span>
        </button>
        <button class="brand" data-brand="sote">
          <span class="swatch" style="background:#f7f4ee"></span>
          <span><b>sote_m</b><small>Футболки и худи</small></span>
          <span class="go">Смотреть</span>
        </button>
        <button class="brand wait" data-brand="fami">
          <span class="swatch" style="background:#f4f1ea"></span>
          <span><b>fami.ly.by</b><small>Ассортимент ещё не собран</small></span>
          <span class="go">Открыть</span>
        </button>
        <button class="brand wait" data-brand="poputi">
          <span class="swatch" style="background:#c9b59a"></span>
          <span><b>Poputi_store</b><small>Ассортимент ещё не собран</small></span>
          <span class="go">Открыть</span>
        </button>
        <button class="brand wait" data-brand="sola">
          <span class="swatch" style="background:#f3efe8"></span>
          <span><b>sola_minsk</b><small>Названы только цены</small></span>
          <span class="go">Открыть</span>
        </button>
      </div>
      <div data-country-group="Россия">
        <h2>Россия</h2>
        <button class="brand" data-brand="art">
          <span class="swatch" style="background:#d9d9d9"></span>
          <span><b>art.brand.jesus.saves</b><small>Футболки</small></span>
          <span class="go">Смотреть</span>
        </button>
      </div>
    </section>

    <section id="brand" class="view">
      <div class="crumbs">
        <button type="button" id="crumb-all">Все бренды</button>
        <span>›</span>
        <button type="button" id="crumb-country"></button>
        <span>›</span>
        <span class="here" id="crumb-brand"></span>
      </div>
      <div class="brand-head">
        <h1 id="title"></h1>
        <p class="blurb" id="blurb"></p>
      </div>
      <p class="stock" id="note"></p>
      <p class="ahead">Вещь выбираете здесь. Оформление заказа на сайте ещё не включено.</p>
      <div class="items" id="items"></div>
    </section>

    <section id="product" class="view">
      <div class="crumbs">
        <button type="button" id="product-all">Все бренды</button>
        <span>›</span>
        <button type="button" id="product-country"></button>
        <span>›</span>
        <button type="button" id="product-brand"></button>
        <span>›</span>
        <span class="here" id="product-crumb"></span>
      </div>
      <article class="product">
        <div class="product-cloth" id="product-cloth"><span class="ph">Место под фото</span></div>
        <div class="product-copy">
          <h1 id="product-title"></h1>
          <p class="size-range" id="size-range" hidden></p>
          <div class="sizes" id="product-sizes" hidden>
            <p>Размер</p>
            <div id="size-options"></div>
          </div>
          <p class="product-price" id="product-price" hidden></p>
          <p class="order" id="choice">Оформление заказа ещё не включено.</p>
        </div>
      </article>
    </section>
    </div>
  </div>
  <script>
    const countryName = { belarus: "Беларусь", russia: "Россия" };
    const countrySlug = { "Беларусь": "belarus", "Россия": "russia" };
    const brands = {
      godderob: {
        country: "Беларусь",
        title: "godderob",
        blurb: "Свитшоты, футболки и полузипы",
        note: "Показаны не все вещи.",
        items: [
          ["#efe8dc", "Свитшот CHILD OF GOD", "S, M, L", "154 BYN", "child-of-god"],
          ["#161616", "Свитшот ONLY JESUS", "S, M, L, XL", "160 BYN", "only-jesus"],
          ["#6f8f62", "Полузип JESUS LOVERS CLUB", "S, M, L, XL", "184 BYN", "jesus-lovers-club"]
        ]
      },
      sote: {
        country: "Беларусь",
        title: "sote_m",
        blurb: "Футболки и худи",
        note: "Показаны не все вещи.",
        items: [
          ["#f7f4ee", "ДОВЕРЯЙ БОГУ", "XS–5XL", "75 BYN", "doveryai-bogu"],
          ["#c4b8a5", "Радуйтесь", "XS–5XL", "80 BYN", "raduites"],
          ["#2c2c2c", "Худи ЛЮБОВЬ", "XS–3XL", "135 BYN", "lyubov"]
        ]
      },
      fami: {
        country: "Беларусь",
        title: "fami.ly.by",
        blurb: "Одежда для всей семьи",
        note: "Ассортимент не собран. Цен в открытых подписях нет.",
        items: [
          ["#f4f1ea", "Иисус — путь, истина, жизнь", "", "", "put"],
          ["#1c1c1c", "Лев и Агнец", "", "", "lev"],
          ["#2f4f86", "JESUS", "", "", "jesus"]
        ]
      },
      poputi: {
        country: "Беларусь",
        title: "Poputi_store",
        blurb: "Христианская одежда",
        note: "Ассортимент не собран.",
        items: [
          ["#c9b59a", "Новая коллекция", "", "", "novaya"]
        ]
      },
      sola: {
        country: "Беларусь",
        title: "sola_minsk",
        blurb: "Футболки и худи",
        note: "Ассортимент не собран. Названы только цены на футболки и худи.",
        items: [
          ["#f3efe8", "Футболка", "", "70 BYN", "futbolka"],
          ["#8d8f92", "Худи", "", "120 BYN", "hudi"]
        ]
      },
      art: {
        country: "Россия",
        title: "art.brand.jesus.saves",
        blurb: "Футболки",
        note: "Показаны не все вещи.",
        items: [
          ["#d9d9d9", "Classic STRENGTH", "Оверсайз", "2000 ₽", "strength"],
          ["#f7f4ee", "Women VICTORY", "Оверсайз", "2000 ₽", "victory"],
          ["#fbfbfb", "HE'S MY DEFENDER", "Оверсайз", "2000 ₽", "defender"]
        ]
      }
    };

    const home = document.getElementById("home");
    const brand = document.getElementById("brand");
    const product = document.getElementById("product");
    const items = document.getElementById("items");
    let currentBrand = null;
    const stage = document.getElementById("stage");
    const menuBtn = document.getElementById("countries-btn");
    const menuList = document.getElementById("country-menu");

    function move(update) {
      stage.classList.remove("enter");
      void stage.offsetWidth;
      update();
      window.scrollTo(0, 0);
      stage.classList.add("enter");
    }

    function showHome() {
      brand.classList.remove("on");
      product.classList.remove("on");
      home.classList.add("on");
    }

    function closeMenu() {
      menuList.hidden = true;
      menuBtn.setAttribute("aria-expanded", "false");
    }

    function reveal(update, animate) {
      if (animate) move(update);
      else update();
    }

    const orderLater = "Оформление заказа на сайте ещё не включено.";

    function listedSizes(size) {
      if (!size || size.includes("–")) return [];
      const parts = size.split(",").map((part) => part.trim()).filter(Boolean);
      return parts.length > 1 ? parts : [];
    }

    function rangeLabel(size) {
      if (!size) return "";
      return size.includes("–") ? `Размеры ${size}` : `Размер ${size}`;
    }

    function writeChoice(size) {
      document.getElementById("choice").textContent = size
        ? `Выбран размер ${size}. ${orderLater}`
        : `Выберите размер. ${orderLater}`;
    }

    function paintCountry(country, animate) {
      const filtered = country !== "all";
      reveal(() => {
        document.querySelectorAll("[data-country-group]").forEach((group) => {
          group.hidden = filtered && group.dataset.countryGroup !== country;
        });
        home.classList.toggle("filtered", filtered);
        document.getElementById("home-crumbs").hidden = !filtered;
        if (filtered) document.getElementById("home-country").textContent = country;
        showHome();
      }, animate);
    }

    function paintBrand(id, animate) {
      const data = brands[id];
      currentBrand = id;
      reveal(() => {
        document.getElementById("crumb-country").textContent = data.country;
        document.getElementById("crumb-brand").textContent = data.title;
        document.getElementById("title").textContent = data.title;
        document.getElementById("blurb").textContent = data.blurb;
        document.getElementById("note").textContent = data.note;
        items.innerHTML = data.items.map(([color, name, size, price, slug]) =>
          `<button type="button" class="item" data-slug="${slug}"><span class="cloth" style="background:${color}"><span class="ph">Место под фото</span></span><span class="body"><b>${name}</b>${size ? `<span>${size}</span>` : ""}${price ? `<span class="price">${price}</span>` : ""}</span></button>`
        ).join("");
        home.classList.remove("on");
        product.classList.remove("on");
        brand.classList.add("on");
      }, animate);
    }

    function paintProduct(id, index, animate) {
      const data = brands[id];
      const [color, name, size, price] = data.items[index];
      currentBrand = id;
      reveal(() => {
        document.getElementById("product-country").textContent = data.country;
        document.getElementById("product-brand").textContent = data.title;
        document.getElementById("product-crumb").textContent = name;
        document.getElementById("product-title").textContent = name;
        document.getElementById("product-cloth").style.background = color;
        const options = listedSizes(size);
        const range = document.getElementById("size-range");
        const sizes = document.getElementById("product-sizes");
        range.hidden = options.length > 0 || !size;
        range.textContent = options.length || !size ? "" : rangeLabel(size);
        sizes.hidden = options.length === 0;
        document.getElementById("size-options").innerHTML = options.map((option) =>
          `<button type="button" class="size">${option}</button>`
        ).join("");
        const priceEl = document.getElementById("product-price");
        priceEl.hidden = !price;
        priceEl.textContent = price;
        document.getElementById("choice").textContent = options.length
          ? `Выберите размер. ${orderLater}`
          : orderLater;
        home.classList.remove("on");
        brand.classList.remove("on");
        product.classList.add("on");
      }, animate);
    }

    function apply(animate) {
      const [first, second] = location.hash.replace(/^#/, "").split("/").filter(Boolean);
      closeMenu();
      if (!first) {
        paintCountry("all", animate);
        return;
      }
      if (countryName[first] && !second) {
        paintCountry(countryName[first], animate);
        return;
      }
      if (brands[first] && !second) {
        paintBrand(first, animate);
        return;
      }
      if (brands[first] && second) {
        const index = brands[first].items.findIndex((item) => item[4] === second);
        if (index !== -1) {
          paintProduct(first, index, animate);
          return;
        }
      }
      paintCountry("all", animate);
    }

    function navigate(hash) {
      const next = hash === "#" ? "" : hash;
      if (location.hash === next) {
        apply(true);
        return;
      }
      location.hash = next;
    }

    menuBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      const willOpen = menuList.hidden;
      menuList.hidden = !willOpen;
      menuBtn.setAttribute("aria-expanded", String(willOpen));
    });
    menuList.addEventListener("click", (event) => event.stopPropagation());
    document.addEventListener("click", closeMenu);

    document.querySelectorAll("[data-slug]").forEach((button) => {
      button.addEventListener("click", () => navigate("#" + button.dataset.slug));
    });
    document.getElementById("logo").addEventListener("click", () => navigate("#"));
    document.getElementById("home-all").addEventListener("click", () => navigate("#"));
    document.getElementById("crumb-all").addEventListener("click", () => navigate("#"));
    document.getElementById("crumb-country").addEventListener("click", () => {
      navigate("#" + countrySlug[document.getElementById("crumb-country").textContent]);
    });
    document.querySelectorAll("[data-brand]").forEach((button) => {
      button.addEventListener("click", () => navigate("#" + button.dataset.brand));
    });
    items.addEventListener("click", (event) => {
      const card = event.target.closest("[data-slug]");
      if (card) navigate(`#${currentBrand}/${card.dataset.slug}`);
    });
    document.getElementById("product-all").addEventListener("click", () => navigate("#"));
    document.getElementById("product-country").addEventListener("click", () => {
      navigate("#" + countrySlug[document.getElementById("product-country").textContent]);
    });
    document.getElementById("product-brand").addEventListener("click", () => navigate("#" + currentBrand));
    document.getElementById("size-options").addEventListener("click", (event) => {
      const button = event.target.closest(".size");
      if (!button) return;
      document.querySelectorAll(".size").forEach((item) => item.classList.toggle("on", item === button));
      writeChoice(button.textContent);
    });

    apply(false);
    window.addEventListener("hashchange", () => apply(true));
  </script>
</body>
</html>
