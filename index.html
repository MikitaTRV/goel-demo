    :root {
      --bg: #f6f3ee;
      --paper: #fffcf8;
      --ink: #1c1916;
      --muted: #6b6560;
      --line: #e3ddd4;
      --accent: #7a3330;
    }
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    button {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      padding: 0;
      cursor: pointer;
      text-align: left;
      -webkit-appearance: none;
      appearance: none;
    }
    .wrap { width: min(980px, calc(100% - 48px)); margin: 0 auto; }
    header {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }
    .mark {
      font-weight: 600;
      font-size: 20px;
      letter-spacing: 0.04em;
    }
    .mark span { letter-spacing: 0; font-weight: 400; font-size: 13px; color: var(--muted); margin-left: 8px; }
    .menu { position: relative; }
    #countries-btn { font-size: 15px; }
    #countries-btn[aria-expanded="true"] { color: var(--accent); }
    .menu-list {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      min-width: 160px;
      background: var(--paper);
      border: 1px solid var(--line);
      z-index: 2;
    }
    .menu-list button { display: block; width: 100%; padding: 10px 14px; font-size: 15px; }
    .menu-list button:hover { background: #f3efe8; }
    nav.links { margin-left: auto; display: flex; gap: 18px; font-size: 15px; }
    .hero { padding: 28px 0 0; }
    h1 {
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-weight: 600;
      font-size: 34px;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin: 0 0 12px;
    }
    .verse { margin: 0 0 8px; max-width: 28em; color: var(--muted); font-size: 16px; line-height: 1.6; }
    .verse span { display: block; margin-top: 8px; }
    h2 {
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-weight: 600;
      font-size: 20px;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--ink);
      margin: 28px 0 12px;
    }
    #home.filtered h2 { display: none; }
    .brand {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 14px;
      align-items: center;
      width: 100%;
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 12px;
      margin-top: 10px;
    }
    .swatch { display: block; width: 64px; height: 64px; }
    .brand b { display: block; font-size: 17px; line-height: 1.35; }
    .brand small { display: block; margin-top: 5px; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .go { color: var(--accent); font-size: 14px; padding-right: 4px; }
    .brand.wait .go { color: var(--muted); }
    .view { display: none; }
    .view.on { display: block; padding-bottom: 48px; }
    #stage.enter { animation: enter 0.32s cubic-bezier(0.2, 0.8, 0.2, 1); }
    @keyframes enter {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #stage.enter { animation: none; }
    }
    #home-crumbs { margin-top: 0; }
    .crumbs { display: flex; gap: 8px; align-items: center; margin: 28px 0 22px; font-size: 14px; line-height: 1.4; color: var(--muted); }
    .crumbs[hidden] { display: none; }
    .crumbs .here { color: var(--ink); }
    .brand-head h1 { font-size: 32px; letter-spacing: -0.03em; line-height: 1.2; margin: 0; }
    .brand-head .blurb { margin: 12px 0 0; color: var(--muted); font-size: 16px; line-height: 1.55; }
    .brand-head .blurb[hidden] { display: none; }
    .colors { margin-top: 18px; }
    .colors[hidden] { display: none; }
    .colors p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
    .colors div { display: flex; flex-wrap: wrap; gap: 8px; }
    .tone {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      cursor: pointer;
      background: var(--tone);
    }
    .tone.on { outline: 2px solid var(--ink); outline-offset: 2px; }
    .items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 28px 0 40px; }
    .item {
      background-color: var(--paper);
      background-image: linear-gradient(var(--swatch), var(--swatch));
      background-repeat: no-repeat;
      background-size: 100% 230px;
      background-position: top left;
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      text-align: left;
      color: inherit;
      text-decoration: none;
    }
    .item:hover { border-color: #cfc6bb; }
    .cloth {
      height: 230px;
      flex: none;
      position: relative;
      outline: 1px solid #cfc6bb;
      outline-offset: -1px;
      background-color: var(--swatch);
      box-shadow: inset 0 0 0 230px var(--swatch);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .cloth.has-photo, .product-cloth.has-photo {
      box-shadow: none;
      background-color: #ddd6cc;
    }
    .cloth > .ph, .product-cloth > .ph {
      position: absolute;
      left: 12px;
      bottom: 12px;
      display: inline-block;
      margin: 0;
      background: var(--paper);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      padding: 4px 8px;
    }
    .cloth.has-photo > .ph, .product-cloth.has-photo > .ph { display: none; }
    .item { width: 100%; }
    .item .body { padding: 16px 16px 18px; }
    .item b { display: block; font-size: 16px; line-height: 1.4; }
    .item span { display: block; color: var(--muted); font-size: 14px; line-height: 1.45; margin-top: 6px; }
    .item .price { color: var(--ink); margin-top: 10px; line-height: 1.4; }
    .stock { margin: 22px 0 0; font-size: 15px; line-height: 1.5; }
    .stock[hidden] { display: none; }
    .ahead { margin: 8px 0 0; font-size: 15px; line-height: 1.5; }
    .order { margin: 16px 0 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .product { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 28px; align-items: start; }
    .product-cloth {
      height: 460px;
      position: relative;
      outline: 1px solid #cfc6bb;
      outline-offset: -1px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .size-range { margin: 12px 0 0; color: var(--muted); }
    .size-range[hidden] { display: none; }
    .product-copy h1 { margin: 0; }
    .sizes { margin-top: 18px; }
    .sizes[hidden] { display: none; }
    .sizes p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
    .sizes div { display: flex; flex-wrap: wrap; gap: 8px; }
    .size {
      width: 52px;
      height: 40px;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--paper);
      text-align: center;
      cursor: pointer;
      font-size: 13px;
    }
    .size.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .product-price { margin: 16px 0 0; font-size: 18px; }
    .source { margin: 14px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .source[hidden] { display: none; }
    .source a { color: inherit; }
    .buy {
      display: inline-block;
      margin-top: 22px;
      background: var(--accent);
      color: #fff;
      padding: 12px 18px;
      font-size: 15px;
      cursor: default;
    }
    @media (max-width: 800px) {
      h1 { font-size: 28px; }
      .items, .product { grid-template-columns: 1fr; }
      .product-cloth { height: 280px; }
      header { gap: 16px; }
    }
  </style>
</head>

          ["#2c2c2c", "Футболка Catch Up With Jesus", "Oversize", "85 BYN", "catch-up"],
          ["#2c2c2c", "Футболка Jesus Loves Gamers", "Oversize", "85 BYN", "gamers"],
          ["#2c2c2c", "Футболка Grace Grace", "Oversize", "80 BYN", "grace-grace"],
          ["#2c2c2c", "Футболка Faith Can Move Mountains", "Oversize", "75 BYN", "mountains"],
          ["#2c2c2c", "Футболка Made For More", "Oversize", "80 BYN", "made-for-more"]
        ]
      },
      art: {
        country: "Россия",
        title: "art.brand.jesus.saves",
        blurb: "Футболки",
        note: "Показаны не все вещи.",
        items: [
          ["#d9d9d9", "Футболка Classic STRENGTH", "Оверсайз", "2000 ₽", "strength"],
          ["#f7f4ee", "Футболка Women VICTORY", "Оверсайз", "2000 ₽", "victory"],
          ["#fbfbfb", "Футболка HE'S MY DEFENDER", "Оверсайз", "2000 ₽", "defender"]
        ]
      }
    };

    const home = document.getElementById("home");
    const brand = document.getElementById("brand");
    const product = document.getElementById("product");
    const items = document.getElementById("items");
    let currentBrand = null;
    let currentItem = null;
    let currentTone = 0;
    const stage = document.getElementById("stage");
    const menuBtn = document.getElementById("countries-btn");
    const menuList = document.getElementById("country-menu");

    Object.values(brands).forEach((data) => {
      data.items = data.items.map((item) => {
        if (!Array.isArray(item)) return item;
        const [color, name, size, price, slug, photo] = item;
        return {
          name,
          slug,
          variants: [{ tone: "", color, size, price, photo: photo || "" }]
        };
      });
    });

    function move(update) {
      stage.classList.remove("enter");
      void stage.offsetWidth;
      update();
      window.scrollTo(0, 0);
      stage.classList.add("enter");
    }

    function showHome() {
      brand.classList.remove("on");
      product.classList.remove("on");
      home.classList.add("on");
    }

    function closeMenu() {
      menuList.hidden = true;
      menuBtn.setAttribute("aria-expanded", "false");
    }

    function reveal(update, animate) {
      if (animate) move(update);
      else update();
    }

    const sizeScale = ["XS", "S", "M", "L", "XL", "2XL", "3XL", "4XL", "5XL"];
    const orderLater = "Оформление заказа на сайте ещё не включено.";

    function listedSizes(size) {
      if (!size) return [];
      const range = size.split("–");
      if (range.length === 2) {
        const from = sizeScale.indexOf(range[0].trim());
        const to = sizeScale.indexOf(range[1].trim());
        if (from !== -1 && to >= from) return sizeScale.slice(from, to + 1);
      }
      const parts = size.split(",").map((part) => part.trim().replace(/^XXL$/i, "2XL")).filter(Boolean);
      if (parts.length === 1 && sizeScale.includes(parts[0])) return parts;
      return parts.length > 1 ? parts : [];
    }

    function rangeLabel(size) {
      if (!size) return "";
      return size.includes("–") ? `Размеры ${size}` : `Размер ${size}`;
    }

    function writeChoice(size) {
      document.getElementById("choice").textContent = size
        ? `Выбран размер ${size}. ${orderLater}`
        : `Выберите размер. ${orderLater}`;
    }

    function cardPrice(item) {
      const prices = item.variants.map((variant) => variant.price).filter(Boolean);
      if (!prices.length) return "";
      const unique = [...new Set(prices)];
      if (unique.length === 1) return unique[0];
      const numbers = unique.map((price) => parseFloat(price)).filter((n) => !Number.isNaN(n));
      if (!numbers.length) return unique[0];
      const min = Math.min(...numbers);
      const unit = unique[0].replace(/[\d.,\s]+/, "").trim();
      return `от ${min} ${unit}`.trim();
    }

    function paintCountry(country, animate) {
      const filtered = country !== "all";
      reveal(() => {
        document.querySelectorAll("[data-country-group]").forEach((group) => {
          group.hidden = filtered && group.dataset.countryGroup !== country;
        });
        home.classList.toggle("filtered", filtered);
        document.getElementById("home-crumbs").hidden = !filtered;
        if (filtered) document.getElementById("home-country").textContent = country;
        showHome();
      }, animate);
    }

    function paintBrand(id, animate) {
      const data = brands[id];
      currentBrand = id;
      reveal(() => {
        document.getElementById("crumb-country").textContent = data.country;
        document.getElementById("crumb-brand").textContent = data.title;
        document.getElementById("title").textContent = data.title;
        const blurb = document.getElementById("blurb");
        blurb.textContent = data.blurb || "";
        blurb.hidden = !data.blurb;
        const note = document.getElementById("note");
        note.textContent = data.note || "";
        note.hidden = !data.note;
        const source = data.source ? `<span>Источник: ${data.source}</span>` : "";
        items.innerHTML = data.items.map((item) => {
          const first = item.variants[0];
          const price = cardPrice(item);
          const photo = first.photo;
          const color = first.color;
          const clothStyle = photo
            ? `--swatch:${color};background-image:url('${photo}')`
            : `--swatch:${color}`;
          const cardStyle = photo
            ? `--swatch:${color}`
            : `--swatch:${color};background-image:linear-gradient(${color},${color})`;
          const photoClass = photo ? " has-photo" : "";
          return `<a class="item" href="?${id}/${item.slug}" data-slug="${item.slug}" style="${cardStyle}"><div class="cloth${photoClass}" style="${clothStyle}"><span class="ph">Место под фото</span></div><span class="body"><b>${item.name}</b>${price ? `<span class="price">${price}</span>` : ""}${source}</span></a>`;
        }).join("");
        home.classList.remove("on");
        product.classList.remove("on");
        brand.classList.add("on");
      }, animate);
    }

    function fillVariant(data, item, toneIndex) {
      const variant = item.variants[toneIndex] || item.variants[0];
      currentTone = item.variants.indexOf(variant);
      const cloth = document.getElementById("product-cloth");
      cloth.classList.toggle("has-photo", !!variant.photo);
      cloth.style.backgroundColor = variant.color;
      cloth.style.backgroundImage = variant.photo
        ? `url('${variant.photo}')`
        : `linear-gradient(${variant.color},${variant.color})`;
      const colors = document.getElementById("product-colors");
      const many = item.variants.length > 1;
      colors.hidden = !many;
      document.getElementById("color-label").textContent = variant.tone
        ? `Цвет: ${variant.tone}`
        : "Цвет";
      document.getElementById("color-options").innerHTML = many
        ? item.variants.map((option, index) =>
            `<button type="button" class="tone${index === currentTone ? " on" : ""}" data-tone="${index}" style="--tone:${option.color}" aria-label="${option.tone || "Цвет"}"></button>`
          ).join("")
        : "";
      const options = listedSizes(variant.size);
      const range = document.getElementById("size-range");
      const sizes = document.getElementById("product-sizes");
      range.hidden = options.length > 0 || !variant.size;
      range.textContent = options.length || !variant.size ? "" : rangeLabel(variant.size);
      sizes.hidden = options.length === 0;
      document.getElementById("size-options").innerHTML = options.map((option) =>
        `<button type="button" class="size">${option}</button>`
      ).join("");
      const priceEl = document.getElementById("product-price");
      priceEl.hidden = !variant.price;
      priceEl.textContent = variant.price || "";
      const sourceEl = document.getElementById("product-source");
      sourceEl.hidden = !data.source;
      sourceEl.innerHTML = data.source ? `Источник: <a href="${data.sourceHref}">${data.source}</a>` : "";
      document.getElementById("choice").textContent = options.length
        ? `Выберите размер. ${orderLater}`
        : orderLater;
    }

    function paintProduct(id, index, animate) {
      const data = brands[id];
      const item = data.items[index];
      currentBrand = id;
      currentItem = item;
      reveal(() => {
        document.getElementById("product-country").textContent = data.country;
        document.getElementById("product-brand").textContent = data.title;
        document.getElementById("product-crumb").textContent = item.name;
        document.getElementById("product-title").textContent = item.name;
        fillVariant(data, item, 0);
        home.classList.remove("on");
        brand.classList.remove("on");
        product.classList.add("on");
      }, animate);
    }

    function currentRoute() {
      const query = location.search.replace(/^\?/, "");
      if (query) return decodeURIComponent(query);
      return location.hash.replace(/^#/, "");
    }

    function apply(animate) {
      const [first, second] = currentRoute().split("/").filter(Boolean);
      closeMenu();
      if (!first) {
        paintCountry("all", animate);
        return;
      }
      if (countryName[first] && !second) {
        paintCountry(countryName[first], animate);
        return;
      }
      if (brands[first] && !second) {
        paintBrand(first, animate);
        return;
      }
      if (brands[first] && second) {
        const index = brands[first].items.findIndex((item) => item.slug === second);
        if (index !== -1) {
          paintProduct(first, index, animate);
          return;
        }
      }
      paintCountry("all", animate);
    }

    function navigate(route) {
      const next = String(route).replace(/^#/, "");
      if (currentRoute() === next) {
        apply(true);
        return;
      }
      history.pushState(null, "", next ? location.pathname + "?" + next : location.pathname);
      apply(true);
    }

    menuBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      const willOpen = menuList.hidden;
      menuList.hidden = !willOpen;
      menuBtn.setAttribute("aria-expanded", String(willOpen));
    });
    menuList.addEventListener("click", (event) => event.stopPropagation());
    document.addEventListener("click", closeMenu);

    document.querySelectorAll("[data-slug]").forEach((button) => {
      button.addEventListener("click", () => navigate("#" + button.dataset.slug));
    });
    document.getElementById("logo").addEventListener("click", () => navigate("#"));
    document.getElementById("home-all").addEventListener("click", () => navigate("#"));
    document.getElementById("crumb-all").addEventListener("click", () => navigate("#"));
    document.getElementById("crumb-country").addEventListener("click", () => {
      navigate("#" + countrySlug[document.getElementById("crumb-country").textContent]);
    });
    document.querySelectorAll("[data-brand]").forEach((button) => {
      button.addEventListener("click", () => navigate("#" + button.dataset.brand));
    });
    items.addEventListener("click", (event) => {
      const card = event.target.closest("a.item");
      if (!card) return;
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
      event.preventDefault();
      navigate(`${currentBrand}/${card.dataset.slug}`);
    });
    document.getElementById("product-all").addEventListener("click", () => navigate("#"));
    document.getElementById("product-country").addEventListener("click", () => {
      navigate("#" + countrySlug[document.getElementById("product-country").textContent]);
    });
    document.getElementById("product-brand").addEventListener("click", () => navigate("#" + currentBrand));
    document.getElementById("color-options").addEventListener("click", (event) => {
      const button = event.target.closest(".tone");
      if (!button || !currentItem || !currentBrand) return;
      fillVariant(brands[currentBrand], currentItem, Number(button.dataset.tone));
    });
    document.getElementById("size-options").addEventListener("click", (event) => {
      const button = event.target.closest(".size");
      if (!button) return;
      document.querySelectorAll(".size").forEach((item) => item.classList.toggle("on", item === button));
      writeChoice(button.textContent);
    });

    apply(false);
    window.addEventListener("popstate", () => apply(true));
    window.addEventListener("hashchange", () => {
      if (!location.search) apply(true);
    });
  </script>
</body>
